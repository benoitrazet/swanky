[workspace]
resolver = "2"
members = [
  "crates/adversary",
  "crates/aes-hash",
  "crates/aes-rng",
  "crates/authenticated-bits",
  "crates/bit-matrix-transpose",
  "crates/block",
  "crates/bristol-fashion",
  "crates/bytearray-utils",
  "crates/channel",
  "crates/channel-legacy",
  "crates/cointoss",
  "crates/deprecated-bitwise-utils",
  "crates/diet-mac-and-cheese",
  "crates/diet-mac-and-cheese/web-mac-and-cheese/wasm",
  "crates/diet-mac-and-cheese/web-mac-and-cheese/websocket",
  "crates/fancy-garbling",
  "crates/field",
  "crates/field-binary",
  "crates/field-f61p",
  "crates/field-ff-primes",
  "crates/field-fft",
  "crates/field-test",
  "crates/flatbuffer-build",
  "crates/humidor",
  "crates/inferno",
  "crates/ocelot-error",
  "crates/oprf-kkrt",
  "crates/oprf-kmprt",
  "crates/oprf-traits",
  "crates/ot-alsz-kos",
  "crates/ot-chou-orlandi",
  "crates/ot-dummy",
  "crates/ot-noar-pinkas",
  "crates/ot-test",
  "crates/ot-traits",
  "crates/party",
  "crates/polynomial",
  "crates/serialization",
  "crates/svole-wykw",
  "keyed_arena",
  "mac-n-cheese/compiler",
  "mac-n-cheese/event-log",
  "mac-n-cheese/inspector",
  "mac-n-cheese/ir",
  "mac-n-cheese/runner",
  "mac-n-cheese/sieve-parser",
  "mac-n-cheese/vole",
  "mac-n-cheese/wire-map",
  "popsicle",
  "schmivitz",
  "simple-arith-circuit",
  "vectoreyes",
  "zkv",
]

[workspace.package]
authors = ["swanky authors <swanky@galois.com>"]
license = "MIT"
edition = "2024"
publish = false
version = "0.6.0"

[workspace.lints.clippy]
type_complexity = "allow"
derived_hash_with_manual_eq = "allow"

[workspace.dependencies]
# Don't remove, or modify, the below "# BEGIN OUR CRATES" line. It's used by ./swanky new-crate
# BEGIN OUR CRATES
bristol-fashion = { path = "crates/bristol-fashion" }
diet-mac-and-cheese = { path = "crates/diet-mac-and-cheese" }
fancy-garbling = { path = "crates/fancy-garbling" }
humidor = { path = "crates/humidor" }
inferno = { path = "crates/inferno" }
keyed_arena = { path = "keyed_arena" }
mac-n-cheese-compiler = { path = "mac-n-cheese/compiler" }
mac-n-cheese-event-log = { path = "mac-n-cheese/event-log" }
mac-n-cheese-inspector = { path = "mac-n-cheese/inspector" }
mac-n-cheese-ir = { path = "mac-n-cheese/ir" }
mac-n-cheese-runner = { path = "mac-n-cheese/runner" }
mac-n-cheese-sieve-parser = { path = "mac-n-cheese/sieve-parser" }
mac-n-cheese-vole = { path = "mac-n-cheese/vole" }
mac-n-cheese-wire-map = { path = "mac-n-cheese/wire-map" }
popsicle = { path = "popsicle" }
schmivitz = { path = "schmivitz" }
simple-arith-circuit = { path = "simple-arith-circuit" }
swanky-adversary = { path = "crates/adversary" }
swanky-aes-hash = { path = "crates/aes-hash" }
swanky-aes-rng = { path = "crates/aes-rng" }
swanky-authenticated-bits = { path = "crates/authenticated-bits" }
swanky-bit-matrix-transpose = { path = "crates/bit-matrix-transpose" }
swanky-block = { path = "crates/block" }
swanky-bytearray-utils = { path = "crates/bytearray-utils" }
swanky-channel = { path = "crates/channel" }
swanky-channel-legacy = { path = "crates/channel-legacy" }
swanky-cointoss = { path = "crates/cointoss" }
swanky-deprecated-bitwise-utils = { path = "crates/deprecated-bitwise-utils" }
swanky-field = { path = "crates/field" }
swanky-field-binary = { path = "crates/field-binary" }
swanky-field-f61p = { path = "crates/field-f61p" }
swanky-field-ff-primes = { path = "crates/field-ff-primes" }
swanky-field-fft = { path = "crates/field-fft" }
swanky-field-test = { path = "crates/field-test" }
swanky-flatbuffer-build = { path = "crates/flatbuffer-build" }
swanky-ocelot-error = { path = "crates/ocelot-error" }
swanky-oprf-kkrt = { path = "crates/oprf-kkrt" }
swanky-oprf-kmprt = { path = "crates/oprf-kmprt" }
swanky-oprf-traits = { path = "crates/oprf-traits" }
swanky-ot-alsz-kos = { path = "crates/ot-alsz-kos" }
swanky-ot-chou-orlandi = { path = "crates/ot-chou-orlandi" }
swanky-ot-dummy = { path = "crates/ot-dummy" }
swanky-ot-noar-pinkas = { path = "crates/ot-noar-pinkas" }
swanky-ot-test = { path = "crates/ot-test" }
swanky-ot-traits = { path = "crates/ot-traits" }
swanky-party = { path = "crates/party" }
swanky-polynomial = { path = "crates/polynomial" }
swanky-serialization = { path = "crates/serialization" }
swanky-svole-wykw = { path = "crates/svole-wykw" }
vectoreyes = { path = "vectoreyes" }
web-mac-n-cheese-wasm = { path = "crates/diet-mac-and-cheese/web-mac-and-cheese/wasm" }
web-mac-n-cheese-websocket = { path = "crates/diet-mac-and-cheese/web-mac-and-cheese/websocket" }
zkv = { path = "zkv" }
# END OUR CRATES
# Don't remove, or modify, the above "# END OUR CRATES" line. It's used by ./swanky new-crate

# Patched Dependencies
ff = { git = "https://github.com/GaloisInc/ff", rev = "c29da06f50c67fe9e7361c26f61ac831915244f8" }
ff_codegen = { git = "https://github.com/GaloisInc/ff", rev = "c29da06f50c67fe9e7361c26f61ac831915244f8" }

# External Dependencies
aes = "0.8.4"
aes-gcm = "0.10.3"
anyhow = "1.0.98"
arc-swap = "1.7.1"
arrayvec = "0.7.6"
bincode = "1"
bitpacking = "0.9.2"
bitvec = { version = "1.0.1", features = ["alloc"] }
# We disable avx512 since we typically run on skylake.
blake3 = { version = "1.8.2", features = ["no_avx512"] }
bufstream = "0.1.4"
bumpalo = "3.19.0"
bumpalo-herd = "0.1.2"
bytemuck = { version = "1.23.1", features = [
  "derive",
  "min_const_generics",
  "extern_crate_alloc",
  "aarch64_simd",
] }
bytes = "1.10.1"
cc = "1.2.27"
ciborium = "0.2.2"
clap = { version = "4.5.40", features = ["derive"] }
color-eyre = "0.6.5"
console_error_panic_hook = "0.1.7"
console_log = { version = "1.0", features = ["color"] }
criterion = "0.6.0"
crossbeam = "0.8.4"
crossbeam-queue = "0.3.12"
crypto-bigint = { version = "0.6.1", features = ["hybrid-array"] }
curve25519-dalek = { version = "4.1.3", features = ["rand_core"] }
dhat = "0.3.3"
digest = "0.10.7"
env_logger = "0.11.8"
eyre = "0.6.12"
flatbuffers = "25.2.10" # Keep this version in sync with crates/flatbuffer-build/src/flatc-ver.txt
flume = "0.11.1"
generic-array = "1.2.0"
hex = "0.4.3"
io-uring = "0.7.8"
itertools = "0.14.0"
jemallocator = "0.5.4"
libc = "0.2.174"
log = "0.4.27"
lz4 = "1.28.1"
memchr = "2.7.5"
memmap2 = "0.9.5"
merkle-cbt = "0.3.2"
merlin = "3.0.0"
mimalloc = { version = "0.1.47", default-features = false }
moka = { version = "0.12.10", features = ["sync"] }
ndarray = "=0.15.6" # See issue #123
# Rather than enabling nix features on a per-crate basis (which could lead to issues where
# compiling the whole workspace might succeed, but compiling an individual crate might fail),
# we just enable all the features we need at the workspace root.
nix = { version = "0.30.1", features = ["sched"] }
num-bigint = "0.4.6"
num-traits = "0.2.19"
num_cpus = "1.17.0"
parking_lot = "0.12.4"
pretty_env_logger = "0.5"
prettyplease = "0.2.35"
proc-macro2 = "1.0.95"
rand = "0.8.5"
rand_chacha = "0.3.1"
rand_core = "0.6.4"
proptest = "1.7.0"
quick-xml = "0.37.5"
quote = "1.0.40"
rayon = "1.10.0"
regex = "1.11.1"
ring = "0.17.14"
rpmalloc = "0.2.2"
rustc-hash = "2.1.1"
rustls = { version = "0.23.28", default-features = false, features = [
  "std",
  "ring",
] }
rustls-pemfile = "2.2.0"
serde = "1.0.219"
serde_json = "1.0.140"
sha2 = "0.10.9"
smallvec = { version = "1.15.1", features = [
  "const_generics",
  "union",
  "const_new",
] }
snafu = "0.8.6"
snmalloc-rs = { version = "0.3.8", default-features = false, features = [
  "build_cc",
  "usecxx17",
] }
sprs = "=0.11.0" # See issue #123
subtle = { version = "2.6.1", features = [
  "core_hint_black_box",
  "const-generics",
] }
syn = { version = "2.0.104", features = ["full"] }
tempfile = "3.20.0"
thiserror = "2.0.12"
toml = "0.8.23"
tungstenite = { version = "0.27.0", features = ["rustls"] }
twox-hash = "2.1.1"
wasm-bindgen = "0.2.100"
zstd = "0.13.3"

[profile.release]
opt-level = 3
debug = true
lto = true
debug-assertions = false
overflow-checks = false
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true

[profile.bench]
opt-level = 3
debug = true
lto = true
debug-assertions = false
overflow-checks = false

[profile.test]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true

[profile.dev.package]
# See #147
jemalloc-sys.opt-level = 3
